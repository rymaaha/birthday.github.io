<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Letters</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Poppins:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="letterk.png">
</head>
<body>
    <div id="cursor"></div>
    <div id="cursor-ring"></div>

    <nav id="nav">
      <a href="index.html" class="nav-logo">K ✦</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="music.html">Playlist</a></li>
        <li><a href="map.html">Universities</a></li>
        <li><a href="messages.html" class="active">Letters</a></li>
        <li><a href="secret.html">✦ Secret</a></li>
        <li><a href="portrait.html">Portrait</a></li>
      </ul>
    </nav>

    <div class="page active" id="page-messages">
        <div class="glass-blob blob-1"></div>
        <div class="glass-blob blob-2"></div>

        <div class="messages-wrap" style="position: relative; z-index: 10; text-align: center; padding: 4rem 2rem 2rem;">
            <h2 style="font-family: 'Playfair Display', serif; font-size: 3rem; margin-bottom: 0.5rem;">Letters</h2>
            <p style="color: var(--muted); font-style: italic; margin-bottom: 1.5rem;">things we wanted to say out loud, written down instead</p>
            
            <h3 style="font-family: 'Poppins', sans-serif; font-size: 1.3rem; color: #ff66a3; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 3.5rem;">Open When...</h3>
            
            <div class="envelope-grid fade-in">
              
              <div class="envelope-wrapper" onclick="openEnvelope(this, 'You\'re stressed', 'Take a deep breath.\n\nYou are incredibly capable and you are going to figure this out, just like you always do.')">
                <div class="envelope">
                  <div class="letter-peek"></div>
                  <div class="env-flap"></div>
                  <div class="env-title">You're stressed</div>
                  <div class="env-seal">❤</div>
                </div>
              </div>

              <div class="envelope-wrapper" onclick="openEnvelope(this, 'You\'re hungry', 'Go get a snack right now.\n\nEverything seems worse on an empty stomach. Treat yourself to something good.')">
                <div class="envelope">
                  <div class="letter-peek"></div>
                  <div class="env-flap"></div>
                  <div class="env-title">You're hungry</div>
                  <div class="env-seal">❤</div>
                </div>
              </div>

              <div class="envelope-wrapper" onclick="openEnvelope(this, 'You need a laugh', 'Insert a really good inside joke here.\n\nSomething specific that never fails to make her smile.')">
                <div class="envelope">
                  <div class="letter-peek"></div>
                  <div class="env-flap"></div>
                  <div class="env-title">You need a laugh</div>
                  <div class="env-seal">❤</div>
                </div>
              </div>

            </div>
        </div>
    </div>

    <div id="letter-modal">
        <div class="letter-content">
            <span class="close-letter" onclick="closeLetter()">×</span>
            <h2 id="modal-title"></h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
