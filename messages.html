<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Letters</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="cursor"></div>
    <div id="cursor-ring"></div>

    <nav id="nav">
      <a href="index.html" class="nav-logo">K ✦</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="music.html">Playlist</a></li>
        <li><a href="map.html">Universities</a></li>
        <li><a href="messages.html" class="active">Letters</a></li>
        <li><a href="secret.html">✦ Secret</a></li>
        <li><a href="portrait.html">Portrait</a></li>
      </ul>
    </nav>

    <div class="page active" id="page-messages">
        <div style="text-align: center; padding: 4rem 2rem 2rem;" class="fade-in">
            <h2 style="font-family: 'Playfair Display', serif; font-size: 3rem;">Letters</h2>
            <p style="color: var(--muted); font-style: italic;">Things you need to hear at different times.</p>
        </div>

        <div class="envelope-grid fade-in">
            <div class="envelope" onclick="this.classList.add('open'); setTimeout(() => openLetter('Open when you are stressed', 'Take a deep breath. You are incredibly capable and you are going to figure this out, just like you always do.'), 400)">
                <h3 style="font-family: 'Space Mono'; font-size: 0.8rem; letter-spacing: 0.1em; color: var(--rose);">OPEN WHEN</h3>
                <p style="font-family: 'Playfair Display', serif; font-size: 1.3rem; margin-top: 15px;">You're stressed</p>
            </div>
            <div class="envelope" onclick="this.classList.add('open'); setTimeout(() => openLetter('Open when you are hungry', 'Go get a snack right now. Everything seems worse on an empty stomach. Treat yourself to something good.'), 400)">
                <h3 style="font-family: 'Space Mono'; font-size: 0.8rem; letter-spacing: 0.1em; color: var(--rose);">OPEN WHEN</h3>
                <p style="font-family: 'Playfair Display', serif; font-size: 1.3rem; margin-top: 15px;">You're hungry</p>
            </div>
            <div class="envelope" onclick="this.classList.add('open'); setTimeout(() => openLetter('Open when you need a laugh', 'Insert a really good inside joke here. Something specific that never fails to make her smile.'), 400)">
                <h3 style="font-family: 'Space Mono'; font-size: 0.8rem; letter-spacing: 0.1em; color: var(--rose);">OPEN WHEN</h3>
                <p style="font-family: 'Playfair Display', serif; font-size: 1.3rem; margin-top: 15px;">You need a laugh</p>
            </div>
        </div>
    </div>

    <div id="letter-modal" class="letter-modal">
        <div class="letter-content">
            <span class="close-letter" onclick="closeLetter()">×</span>
            <h2 id="modal-title" style="font-family: 'Playfair Display', serif; color: var(--rose); margin-bottom: 1.5rem;"></h2>
            <p id="modal-body" style="line-height: 1.8; font-size: 1.15rem;"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
