<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>

<nav id="nav">
  <div class="nav-logo"><a href="index.html">K ✦</a></div>
  <ul class="nav-links">

<div class="page" id="page-gallery">
  <div class="gallery-header fade-in">
    <h2>Gallery</h2>
    <p>a visual record of someone worth remembering</p>
  </div>

  <div class="upload-zone fade-in" onclick="document.getElementById('photo-input').click()">
    <p>✦ drop photos here to add them to the gallery · click to browse</p>
    <input type="file" id="photo-input" accept="image/*" multiple>
  </div>

  <div class="photo-grid fade-in" id="photo-grid">
    <div class="photo-card" tabindex="0">
      <div class="photo-placeholder">
        <div class="icon">◻</div>
        <div class="label">add a photo<br>click upload above</div>
      </div>
      <div class="photo-caption">caption here</div>
    </div>
  </div>
</div>

<div id="lightbox">
  <span id="lb-close">×</span>
  <img id="lb-img" src="" alt="">
</div>

<script src="script.js"></script>
</body>
</html>
