  <div class="page active fade-in" id="page-memory">
    <div class="memory-header">
      <h2>The Memory</h2>
      <p>Moments in motion. Click to play, scroll to remember.</p>
    </div>

    <div class="memory-grid">
      <div class="memory-card" onclick="openReel(0)">
        <video src="https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4" muted loop playsinline></video>
        <div class="memory-caption">that one time</div>
      </div>
      <div class="memory-card" onclick="openReel(1)">
        <video src="https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" muted loop playsinline></video>
        <div class="memory-caption">somewhere good</div>
      </div>
      <div class="memory-card" onclick="openReel(2)">
        <video src="https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" muted loop playsinline></video>
        <div class="memory-caption">the best sound</div>
      </div>
      <div class="memory-card" onclick="openReel(3)">
        <video src="https://storage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" muted loop playsinline></video>
        <div class="memory-caption">when she wasn't looking</div>
      </div>
      <div class="memory-card" onclick="openReel(4)">
        <video src="https://storage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4" muted loop playsinline></video>
        <div class="memory-caption">the two of you</div>
      </div>
    </div>
  </div>

  <div id="reels-modal">
    <div id="reels-close" onclick="closeReel()">✕</div>
    
    <div id="reels-container">
      <div class="reel-item">
        <video src="https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4" loop playsinline controls></video>
